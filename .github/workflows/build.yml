
name: Build NEXUS 4.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Build NEXUS EXE
        run: |
          pyinstaller --clean --onefile --windowed --name "NEXUS-4.0" --collect-all customtkinter --collect-all darkdetect main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-4.0-Windows
          path: dist/NEXUS-4.0.exe
