
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name EXE-Icon-Changer icon_changer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Icon-Changer
          path: dist/EXE-Icon-Changer.exe
